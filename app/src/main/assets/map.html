<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobeNews Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * { margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; background: #1a1a2e; }

        .cluster-icon {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .cluster-small { width: 36px; height: 36px; }
        .cluster-medium { width: 44px; height: 44px; }
        .cluster-large { width: 52px; height: 52px; font-size: 15px; }

        .marker-cluster { background: none !important; }

        .leaflet-popup-content-wrapper {
            background: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 13px;
        }
        .leaflet-popup-tip { background: #1a1a2e; }
        .leaflet-popup-content { margin: 8px 12px; }

        .leaflet-control-attribution { font-size: 8px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // ============================================================
        // MAP INITIALIZATION
        // ============================================================
        var map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            minZoom: 2,
            maxZoom: 18,
            worldCopyJump: true,
            zoomControl: false,
            maxBounds: [[-85, -180], [85, 180]],
            maxBoundsViscosity: 1.0
        });

        // Tile layers
        var tileLayers = {
            dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CartoDB &copy; OSM',
                maxZoom: 19,
                subdomains: 'abcd'
            }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; Esri',
                maxZoom: 18
            }),
            streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            })
        };

        tileLayers.dark.addTo(map);
        var currentLayer = 'dark';

        // ============================================================
        // MARKER CLUSTER GROUP
        // ============================================================
        var clusterGroup = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            disableClusteringAtZoom: 14,
            chunkedLoading: true,
            iconCreateFunction: function(cluster) {
                var count = cluster.getChildCount();
                var sizeClass = count < 10 ? 'small' : count < 100 ? 'medium' : 'large';
                return L.divIcon({
                    html: '<div class="cluster-icon cluster-' + sizeClass + '">' + count + '</div>',
                    className: 'marker-cluster',
                    iconSize: L.point(40, 40)
                });
            }
        });
        map.addLayer(clusterGroup);

        // Category colors
        var CATEGORY_COLORS = {
            'CONFLICT': '#FF4444',
            'POLITICS': '#FF8800',
            'ECONOMY': '#44BB44',
            'ENVIRONMENT': '#22AA88',
            'HEALTH': '#AA44FF',
            'TECHNOLOGY': '#4488FF',
            'CRIME': '#FFAA00',
            'ENERGY': '#FFDD00'
        };
        var DEFAULT_COLOR = '#AAAAAA';

        // Marker storage
        var markerMap = {};

        // ============================================================
        // JS FUNCTIONS CALLABLE FROM KOTLIN
        // ============================================================

        function addMarkers(jsonArrayString) {
            try {
                var stories = JSON.parse(jsonArrayString);
                var newIds = {};

                // Add only NEW markers (skip existing)
                for (var i = 0; i < stories.length; i++) {
                    var story = stories[i];
                    newIds[story.id] = true;

                    if (markerMap[story.id]) continue; // Already on map

                    var color = CATEGORY_COLORS[story.category] || DEFAULT_COLOR;

                    var radius = 5;
                    if (story.hoursAgo !== undefined) {
                        radius = story.hoursAgo < 6 ? 8 : story.hoursAgo < 24 ? 6 : 4;
                    }

                    var marker = L.circleMarker([story.lat, story.lon], {
                        radius: radius,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 1,
                        opacity: 0.9,
                        fillOpacity: 0.8
                    });

                    marker.bindTooltip(story.title || '', {
                        direction: 'top',
                        offset: [0, -8]
                    });

                    (function(s) {
                        marker.on('click', function() {
                            try {
                                AndroidBridge.onMarkerTap(s.id);
                            } catch(e) { console.log('Bridge not available'); }
                        });
                    })(story);

                    markerMap[story.id] = marker;
                    clusterGroup.addLayer(marker);
                }

                // Remove markers no longer in the list
                var idsToRemove = [];
                for (var id in markerMap) {
                    if (!newIds[id]) idsToRemove.push(id);
                }
                for (var j = 0; j < idsToRemove.length; j++) {
                    clusterGroup.removeLayer(markerMap[idsToRemove[j]]);
                    delete markerMap[idsToRemove[j]];
                }
            } catch(e) {
                console.error('addMarkers error:', e);
            }
        }

        function clearMarkers() {
            clusterGroup.clearLayers();
            for (var k in markerMap) { delete markerMap[k]; }
        }

        function flyTo(lat, lon, zoomLevel) {
            map.flyTo([lat, lon], zoomLevel || 10, { duration: 1.5 });
        }

        function getCurrentView() {
            var center = map.getCenter();
            var bounds = map.getBounds();
            return JSON.stringify({
                lat: center.lat,
                lon: center.lng,
                zoom: map.getZoom(),
                bounds: {
                    north: bounds.getNorth(),
                    south: bounds.getSouth(),
                    east: bounds.getEast(),
                    west: bounds.getWest()
                }
            });
        }

        function setBaseLayer(layerName) {
            if (tileLayers[layerName] && layerName !== currentLayer) {
                map.removeLayer(tileLayers[currentLayer]);
                tileLayers[layerName].addTo(map);
                currentLayer = layerName;
            }
        }

        function highlightMarker(id) {
            var marker = markerMap[id];
            if (marker) {
                map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 8), { duration: 1 });
                marker.openTooltip();
                var origRadius = marker.getRadius();
                marker.setRadius(origRadius * 2);
                setTimeout(function() { marker.setRadius(origRadius); }, 600);
            }
        }

        // ============================================================
        // MAP EVENTS → KOTLIN CALLBACKS
        // ============================================================
        var moveTimeout = null;
        map.on('moveend', function() {
            clearTimeout(moveTimeout);
            moveTimeout = setTimeout(function() {
                try {
                    var center = map.getCenter();
                    var bounds = map.getBounds();
                    var viewJson = JSON.stringify({
                        lat: center.lat,
                        lon: center.lng,
                        zoom: map.getZoom(),
                        bounds: {
                            north: bounds.getNorth(),
                            south: bounds.getSouth(),
                            east: bounds.getEast(),
                            west: bounds.getWest()
                        }
                    });
                    AndroidBridge.onCameraMove(viewJson);
                } catch(e) { console.log('Bridge not available'); }
            }, 400);
        });

        // Signal ready
        map.whenReady(function() {
            try {
                AndroidBridge.onReady();
            } catch(e) { console.log('Bridge not available'); }
        });
    </script>
</body>
</html>
