<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GlobeNews</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #cesiumContainer {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
        }
        .cesium-viewer-bottom, .cesium-viewer-toolbar,
        .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer,
        .cesium-viewer-fullscreenContainer, .cesium-viewer-infoBoxContainer,
        .cesium-viewer-selectionIndicatorContainer, .cesium-viewer-geocoderContainer,
        .cesium-viewer-navigationHelpButtonContainer, .cesium-viewer-homeButtonContainer,
        .cesium-viewer-sceneModePicker, .cesium-viewer-projectionPicker,
        .cesium-viewer-baseLayerPickerContainer {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        // Disable Cesium Ion default token (we use free layers only)
        Cesium.Ion.defaultAccessToken = undefined;

        const CATEGORY_COLORS = {
            'CONFLICT': '#FF4444',
            'POLITICS': '#FF8800',
            'ECONOMY': '#44BB44',
            'ENVIRONMENT': '#22AA88',
            'HEALTH': '#AA44FF',
            'TECHNOLOGY': '#4488FF',
            'CRIME': '#FFAA00',
            'ENERGY': '#FFDD00',
            'ALL': '#AAAAAA'
        };

        let viewer;
        let cameraTimeout;
        let markers = {};

        function initViewer() {
            viewer = new Cesium.Viewer('cesiumContainer', {
                imageryProvider: new Cesium.UrlTemplateImageryProvider({
                    url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                    subdomains: ['a', 'b', 'c', 'd'],
                    credit: 'CartoDB'
                }),
                terrainProvider: undefined,
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                sceneModePicker: false,
                selectionIndicator: false,
                timeline: false,
                animation: false,
                fullscreenButton: false,
                navigationHelpButton: false,
                projectionPicker: false,
                requestRenderMode: false,
                maximumRenderTimeChange: Infinity
            });

            // Enable scene lighting for day/night terminator
            viewer.scene.globe.enableLighting = true;

            // Clustering
            viewer.dataSourceDisplay.defaultDataSource.clustering.enabled = true;
            viewer.dataSourceDisplay.defaultDataSource.clustering.pixelRange = 50;
            viewer.dataSourceDisplay.defaultDataSource.clustering.minimumClusterSize = 3;

            // Camera move handler with debounce
            viewer.camera.changed.addEventListener(function() {
                clearTimeout(cameraTimeout);
                cameraTimeout = setTimeout(function() {
                    try {
                        var viewJson = getCurrentView();
                        if (typeof AndroidBridge !== 'undefined') {
                            AndroidBridge.onCameraMove(viewJson);
                        }
                    } catch(e) {
                        console.error('Camera move callback error:', e);
                    }
                }, 400);
            });
            viewer.camera.percentageChanged = 0.1;

            // Click handler for markers
            var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
            handler.setInputAction(function(click) {
                var picked = viewer.scene.pick(click.position);
                if (Cesium.defined(picked) && picked.id && picked.id._storyId) {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.onMarkerTap(picked.id._storyId);
                    }
                }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

            // Notify Android that we're ready
            setTimeout(function() {
                if (typeof AndroidBridge !== 'undefined') {
                    AndroidBridge.onReady();
                }
            }, 500);
        }

        function addMarkers(jsonArrayString) {
            try {
                var items = JSON.parse(jsonArrayString);
                // Remove existing markers
                viewer.entities.removeAll();
                markers = {};

                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var color = Cesium.Color.fromCssColorString(
                        CATEGORY_COLORS[item.category] || CATEGORY_COLORS['ALL']
                    );

                    // Size by recency
                    var ageHours = (Date.now() - new Date(item.publishedAt).getTime()) / 3600000;
                    var size;
                    if (ageHours < 6) {
                        size = 12;
                    } else if (ageHours < 24) {
                        size = 9;
                    } else {
                        size = 6;
                    }

                    var entity = viewer.entities.add({
                        position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat),
                        point: {
                            pixelSize: size,
                            color: color,
                            outlineColor: Cesium.Color.WHITE.withAlpha(0.5),
                            outlineWidth: 1,
                            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                            disableDepthTestDistance: Number.POSITIVE_INFINITY
                        },
                        label: {
                            text: item.title.length > 40 ? item.title.substring(0, 40) + '...' : item.title,
                            font: '11px sans-serif',
                            fillColor: Cesium.Color.WHITE,
                            outlineColor: Cesium.Color.BLACK,
                            outlineWidth: 2,
                            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                            pixelOffset: new Cesium.Cartesian2(0, -16),
                            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 3000000),
                            disableDepthTestDistance: Number.POSITIVE_INFINITY
                        }
                    });
                    entity._storyId = item.id;
                    markers[item.id] = entity;
                }
            } catch(e) {
                console.error('addMarkers error:', e);
            }
        }

        function clearMarkers() {
            viewer.entities.removeAll();
            markers = {};
        }

        function flyTo(lat, lon, altitudeKm) {
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(lon, lat, altitudeKm * 1000),
                duration: 1.5
            });
        }

        function getCurrentView() {
            var pos = viewer.camera.positionCartographic;
            var lat = Cesium.Math.toDegrees(pos.latitude);
            var lon = Cesium.Math.toDegrees(pos.longitude);
            var altitude = pos.height / 1000; // Convert to km

            var rect = viewer.camera.computeViewRectangle();
            var bounds = null;
            if (rect) {
                bounds = {
                    north: Cesium.Math.toDegrees(rect.north),
                    south: Cesium.Math.toDegrees(rect.south),
                    east: Cesium.Math.toDegrees(rect.east),
                    west: Cesium.Math.toDegrees(rect.west)
                };
            }

            return JSON.stringify({
                lat: lat,
                lon: lon,
                altitude: altitude,
                bounds: bounds
            });
        }

        function setBaseLayer(providerName) {
            var layers = viewer.imageryLayers;
            layers.removeAll();

            var provider;
            switch(providerName) {
                case 'satellite':
                    provider = new Cesium.UrlTemplateImageryProvider({
                        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                        credit: 'Esri'
                    });
                    break;
                case 'streets':
                    provider = new Cesium.UrlTemplateImageryProvider({
                        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        subdomains: ['a', 'b', 'c'],
                        credit: 'OpenStreetMap'
                    });
                    break;
                case 'dark':
                default:
                    provider = new Cesium.UrlTemplateImageryProvider({
                        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                        subdomains: ['a', 'b', 'c', 'd'],
                        credit: 'CartoDB'
                    });
                    break;
            }
            layers.addImageryProvider(provider);
        }

        function highlightMarker(id) {
            // Reset all
            for (var key in markers) {
                if (markers[key].point) {
                    markers[key].point.outlineWidth = 1;
                    markers[key].point.outlineColor = Cesium.Color.WHITE.withAlpha(0.5);
                }
            }
            // Highlight selected
            if (markers[id] && markers[id].point) {
                markers[id].point.outlineWidth = 3;
                markers[id].point.outlineColor = Cesium.Color.WHITE;
                markers[id].point.pixelSize = 16;
            }
        }

        // Initialize on load
        initViewer();
    </script>
</body>
</html>
